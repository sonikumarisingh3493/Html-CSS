<!--implement a basic responsive grid layout using a front-end framework like Bootstrap or foundation-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <title>Responsive Grid Layout</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrsp@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            .box {
                background-color: lightblue;
                border: 2px solid blue;
                padding: 30px;
                text-align: center;
                font-size: 20px;
                margin-top: 15px;
            }
        </style>
    </head>

    <body>

        <div class="container mt-4">

            <h2 class="text-center mb-4">Responsive Grid Layout</h2>

            <div class="row">

                <div class="col-sm-6 col-md-4">
                    <div class="box">column 1</div>
                </div>

                <div class="col-sm-6 col-md-4">
                    <div class="box">column 2</div>
                </div>

                <div class="col-sm-12 col-md-4">
                    <div class="box">column 3</div>
                </div>

            </div>

        </div>

    </body>
</html>
