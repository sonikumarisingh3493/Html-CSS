<!--use a front-end framework like Bulma and ULKit to create a rsponsive card component with an image and text-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

        <title>Responsive Card</title>

        <!--bulma css framework-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    </head>

    <body>

        <section class="section">
            <div class="container">

                <div class="columns is-centered">

                    <div class="column is-12-mobile is-6-table is-4-desktop">

                        <div class="card">

                            <div class="card-image">
                                <figure class="image is-4by3">
                                    <img src="https://images.unsplash.com/photo-1515705576963-95cad62945b6?q=80&w=
                                    1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                                </figure>
                            </div>

                            <div class="card-content">
                                <p class="title is-4">Nature card</p>

                                <p class="content">This is a responsive card created using Bulma framework.
                                    it automatically adjust on mobile,tablet, and desktop screens.</p>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>
        
    </body>
</html>
